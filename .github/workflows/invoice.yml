# 每月 26、27 日抓最新中獎號碼;每次都更新檢查日期,避免 GitHub 因閒置停用排程
name: 更新發票中獎號碼
on:
  schedule:
    - cron: '0 6 26,27 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 抓號碼
        env:
          INVOICE_OUT: data/invoice.json
        run: python3 tools/build_invoice.py
      - name: 存檔
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add data/invoice.json
          git diff --cached --quiet || git commit -m '更新發票中獎號碼'
          git push
